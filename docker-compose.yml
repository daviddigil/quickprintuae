# Local / single-server deployment. For production put Caddy (see README) in front and set real secrets.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quickprint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quickprint}
      POSTGRES_DB: quickprint
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickprint -d quickprint"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: web/.env
        required: false
    environment:
      DATABASE_URL: postgres://quickprint:${POSTGRES_PASSWORD:-quickprint}@db:5432/quickprint
      APP_URL: ${APP_URL:-http://localhost:${WEB_PORT:-3000}}
      ROOT_DOMAIN: ${ROOT_DOMAIN:-localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET (openssl rand -hex 32)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY (openssl rand -hex 32)}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET}
      UPLOAD_DIR: /data/uploads
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # Runs billing (daily), walk-in queue sweep + orphan cleanup (hourly) and file retention purge (daily).
  # Replace with your scheduler of choice in production.
  cron:
    image: alpine:3.20
    restart: unless-stopped
    depends_on: [web]
    environment:
      CRON_SECRET: ${CRON_SECRET}
    command: >
      sh -c 'apk add --no-cache curl >/dev/null &&
      echo "15 2 * * * curl -fsS \"http://web:3000/api/v1/superadmin/cron/billing?secret=$$CRON_SECRET\"" > /etc/crontabs/root &&
      echo "30 3 * * * curl -fsS \"http://web:3000/api/cron/purge?secret=$$CRON_SECRET\"" >> /etc/crontabs/root &&
      echo "5 * * * * curl -fsS \"http://web:3000/api/cron/walk-in?secret=$$CRON_SECRET\"" >> /etc/crontabs/root &&
      crond -f -l 8'

volumes:
  pgdata:
  uploads:
