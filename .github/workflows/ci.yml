name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qp
          POSTGRES_PASSWORD: qp
          POSTGRES_DB: quickprint
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://qp:qp@localhost:5432/quickprint
      AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      ENCRYPTION_KEY: ci-encryption-0123456789abcdef0123456789
      CRON_SECRET: ci-cron
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npx tsx --test $(find src -name '*.test.ts')
      - name: Migrate & seed
        run: npx drizzle-kit migrate && npm run db:seed
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
